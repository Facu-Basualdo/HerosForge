plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Sólo hace falta para depender de otros mods: Loom ya agrega los repositorios
	// de Minecraft y sus librerías.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	// La pantalla propia (src/client) sólo existe en el cliente: separada, el servidor no puede tocar
	// por error una clase de cliente, que en un servidor dedicado no existe
	splitEnvironmentSourceSets()

	mods {
		"herosforge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Segundo cliente para probar con 2 jugadores a la vez: gradlew runClient2
		client2 {
			client()
			configName = "Minecraft Client 2"
			programArgs "--username", "Jugador2"
			runDir "run-client2"
		}
	}
}

dependencies {
	// Las versiones están en gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu es opcional: sólo para compilar IntegracionConModMenu, que Mod Menu carga si está instalado
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// MIT pide que el aviso de copyright viaje con cada copia, y el jar es la copia que circula.
jar {
	from("LICENSE")
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Pruebas automáticas dentro del juego (src/gametest): gradlew runGameTest (servidor sin ventana) y
// gradlew runClientGameTest (abre un cliente de verdad para probar la pantalla propia y saca capturas)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "herosforge-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// Suite separada con el mod real: -PsoulLinkJar=<ruta al jar>. No se empaqueta dentro de Hero's Forge.
def soulLinkJar = providers.gradleProperty('soulLinkJar')
if (soulLinkJar.isPresent()) {
	dependencies {
		gametestRuntimeOnly files(soulLinkJar.get())
	}
	processGametestResources {
		inputs.property('soulLinkJar', soulLinkJar.get())
		filesMatching('fabric.mod.json') {
			filter { line -> line.replace('com.herosforge.test.HerosForgeGameTest', 'com.herosforge.test.SoulLinkGameTest') }
		}
	}
}

// El servidor de prueba guarda su config en build/run/gameTest y no la pisa: si quedara la de una corrida vieja,
// los tests correrían con los valores por defecto de antes y no con los de Configuracion.POR_DEFECTO
// (lo mismo con el cliente de prueba, que además guarda ahí herosforge-cliente.json)
def configDePrueba = layout.buildDirectory.dir("run/gameTest/config")
def configDelClienteDePrueba = layout.buildDirectory.dir("run/clientGameTest/config")
tasks.matching { it.name == "runGameTest" }.configureEach {
	doFirst {
		configDePrueba.get().asFile.deleteDir()
	}
}
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	doFirst {
		configDelClienteDePrueba.get().asFile.deleteDir()
	}
}
