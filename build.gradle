plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Sólo hace falta para depender de otros mods: Loom ya agrega los repositorios
	// de Minecraft y sus librerías.
}

loom {
	mods {
		"estadisticasrpg" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// Segundo cliente para probar con 2 jugadores a la vez: gradlew runClient2
		client2 {
			client()
			configName = "Minecraft Client 2"
			programArgs "--username", "Jugador2"
			runDir "run-client2"
		}
	}
}

dependencies {
	// Las versiones están en gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// MIT pide que el aviso de copyright viaje con cada copia, y el jar es la copia que circula.
jar {
	from("LICENSE")
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Pruebas automáticas dentro del juego (src/gametest): gradlew runGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "estadisticasrpg-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}
